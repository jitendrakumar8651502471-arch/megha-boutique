<!DOCTYPE html>
<html lang="hi">
<head>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .product-card { border: 1px solid #ccc; padding: 20px; width: 250px; display: inline-block; border-radius: 10px; box-shadow: 2px 2px 10px #ccc; }
        .buy-btn { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        #payment-section { display: none; margin: 20px auto; padding: 20px; border: 2px solid #28a745; width: 300px; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Megha Boutique & Computer Services</h1>
    <p>Indira Nagar, Road Number 9 | 8789201909</p>
    <p>Timing: 8:00 AM - 11:00 AM | 3:00 PM - 11:00 PM</p>
</header>

<div class="product-card">
    <h3>Designer Kurti</h3>
    <p>Price: ₹2500</p>
    <button class="buy-btn" onclick="showPayment()">Buy Now</button>
</div>

<div id="payment-section">
    <h2>Payment Karein</h2>
    <p>QR Code scan karein:</p>
    <!-- Yahan aapki nayi upload ki gayi image ka naam hai -->
    <img src="WhatsApp Image 2026-06-17 at 07.16.00.png" alt="QR Code" width="200" style="border: 2px solid #000;">
    <br><br>
    <a href="upi://pay?pa=7277188291@ptyes&pn=Jitendra%20Kumar&am=2500" style="padding:10px; background:#007bff; color:white; text-decoration:none; border-radius:5px;">Pay ₹2500 via UPI</a>
    <br><br>
    <button onclick="document.getElementById('payment-section').style.display='none'">Close</button>
</div>

<script>
    function showPayment() {
        document.getElementById('payment-section').style.display = 'block';
    }
</script>

</body>
</html>
